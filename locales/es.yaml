      distance: "1.52× distancia Tierra–Sol"
      period: "687 días"
      mass: "0.11 masas terrestres"
      size: "0.53 diámetros terrestres"
      type: "Planeta rocoso"
      desc: "El planeta rojo; alberga el volcán más alto del sistema solar, el Olympus Mons."
    Jupiter:
      distance: "5.20× distancia Tierra–Sol"
      period: "12 años"
      mass: "318 masas terrestres"
      size: "11.2 diámetros terrestres"
      type: "Gigante gaseoso"
      desc: "El planeta más grande; la Gran Mancha Roja es una tormenta mayor que la Tierra."
    Saturn:
      distance: "9.54× distancia Tierra–Sol"
      period: "29 años"
      mass: "95 masas terrestres"
      size: "9.45 diámetros terrestres"
      type: "Gigante gaseoso"
      desc: "Célebre por sus anillos de hielo y roca."
    Uranus:
      distance: "19.2× distancia Tierra–Sol"
      period: "84 años"
      mass: "14.5 masas terrestres"
      size: "4 diámetros terrestres"
      type: "Gigante de hielo"
      desc: "Un gigante de hielo rotando de lado, quizá por un antiguo impacto."
    Neptun:
      distance: "30.1× distancia Tierra–Sol"
      period: "165 años"
      mass: "17.1 masas terrestres"
      size: "3.9 diámetros terrestres"
      type: "Gigante de hielo"
      desc: "El planeta mayor más lejano; la luz tarda más de cuatro horas en llegar desde el Sol."
    Ceres:
      distance: "≈2,77 UA (semieje mayor)"
      period: "≈4,6 años"
      mass: "≈0,013 masas terrestres"
      size: "≈0,07 diámetros terrestres"
      type: "Planeta enano"
      desc: "Ceres es el objeto más grande del cinturón de asteroides. Fue descubierto el 1 de enero de 1801 por Giuseppe Piazzi en el Observatorio de Palermo y recibe su nombre de la diosa romana de la agricultura."
    Pluto:
      distance: "≈39,5 UA"
      period: "≈248 años"
      mass: "≈0,002 masas terrestres"
      size: "≈0,19 diámetros terrestres"
      type: "Planeta enano"
      desc: "Descubierto el 18 de febrero de 1930, es el planeta enano más grande y el segundo más masivo conocido del sistema solar. También es el objeto más antiguo conocido del cinturón de Kuiper. Debido a su órbita altamente excéntrica, Plutón se encuentra más cerca del Sol que Neptuno en su punto de máxima aproximación."
    Haumea:
      distance: "≈43 UA"
      period: "≈284 años"
      mass: "≈0,0007 masas terrestres"
      size: "≈0,13 diámetros terrestres (ecuatorial, alargado)"
      type: "Planeta enano"
      desc: "Planeta enano del cinturón de Kuiper, muy achatado por su rápida rotación y con un anillo."
    Makemake:
      distance: "≈46 UA"
      period: "≈306 años"
      mass: "≈0,0004 masas terrestres"
      size: "≈0,11 diámetros terrestres"
      type: "Planeta enano"
      desc: "Makemake es un planeta enano del cinturón de Kuiper con una superficie muy oscura y rojiza. Fue descubierto el 31 de marzo de 2005 y recibe su nombre de Makemake, la diosa de la creación en la mitología de la isla de Pascua."
    Eris:
      distance: "≈68 UA"
      period: "≈558 años"
      mass: "≈0,003 masas terrestres"
      size: "≈0,18 diámetros terrestres"
      type: "Planeta enano"
      desc: "Eris es el planeta enano más grande conocido de nuestro sistema solar después de Plutón. Recibe su nombre de la diosa griega de la discordia y la contienda."
    Sedna:
      distance: "≈552 UA (semieje mayor)"
      period: "≈13 000 años (período orbital modelo)"
      mass: "≈0,00017 masas terrestres"
      size: "≈0,08 diámetros terrestres"
      type: "Objeto transneptuniano"
      desc: "Sedna es un gran objeto transneptuniano (TNO) situado más allá del cinturón de Kuiper. Debido a su tamaño y masa, es probable que se clasifique como planeta enano. Fue descubierto el 14 de noviembre de 2003."
    belt_asteroid:
      distance: "≈2–3,5 UA del Sol"
      type: "Cinturón de asteroides"
      desc: "El cinturón de asteroides, también conocido como cinturón de planetoides o cinturón principal, es una región del sistema solar que contiene un gran número de estos cuerpos celestes. Se encuentra entre las órbitas de Marte y Júpiter."
    belt_kuiper:
      distance: "≈40–50 UA del Sol"
      type: "Cinturón de asteroides"
      desc: "El cinturón de Kuiper es una región del espacio que contiene numerosos objetos pequeños, helados y rocosos. Lleva el nombre de su descubridor, Gerard Peter Kuiper, y se encuentra más allá de la órbita de Neptuno."
    belt_oort:
      distance: "≈2 500–100 000 UA"
      type: "Nube de cometas circunsolar"
      desc: "La nube de Oort, también conocida como nube de Oort-Öpik, es una región del espacio que contiene cometas y se encuentra en los confines de nuestro sistema solar. Fue propuesta por primera vez por el astrónomo neerlandés Jan Hendrik Oort en 1950 y se considera el origen de los cometas de período largo."
      scale_nominal: ""

